target:
  # Enterprise Store: serves blobs directly (HTTP 200), no CDN redirect.
  store_url: https://enterprise-store.snapd.canonical.com
  # The enterprise Store's certificate is signed by an internal CA that the
  # test machine does not trust.
  verify_tls: false
  snap: gimp
  channel: latest/stable
  architecture: amd64
  # Expected enterprise payload (revision 561); validate size changes against
  # this Store independently, since production may serve a newer revision.
  expected_size_bytes: 147734528
  # Match the production GIMP profile: complete snaps, not byte ranges.
  byte_range: null
  store_headers:
    Snap-Device-Architecture: amd64
    Snap-Device-Series: "16"
  download_headers:
    Accept-Encoding: identity

load:
  # Match the production workload for comparability.
  concurrent_downloads: [2, 4, 8, 16]
  duration: 5m
  threads: 2
  # This does not extend the stage deadline or drain unfinished downloads.
  timeout: 5m
  pause_seconds: 5

preflight:
  expected_redirect_status: 302
  expected_download_status: 200
  max_redirects: 5

# Warmup downloads use load.timeout; raise it for large cold snaps.
warmup:
  requests: 3

safety:
  # Concurrency has unknown transfer volume; --allow-over-budget is required.
  # These legacy rate-estimate settings do not enforce a runtime byte cap.
  estimate_multiplier: 2.0
  max_estimated_transfer_mib: 2048

output:
  directory: ../results

wrk:
  binary: wrk
