target:
  url: https://api.snapcraft.io/v2/snaps/refresh
  # Generate the refresh request for this snap instead of replaying a capture.
  snap: gimp
  channel: latest/stable
  # revision: 560  # pretend this revision is installed; the default is the
  # channel's current revision, which answers "no refresh needed".
  # Device authorization macaroon (a single "Macaroon ..." line) from a real
  # capture or a device's snapd state.
  auth_file: ../device-authorization

load:
  requests_per_second:
    start: 1
    end: 10
    increment: 1
  duration: 30s
  connections: 10
  threads: 2
  scale_workers_with_rate: true
  timeout: 10s
  pause_seconds: 5

preflight:
  enabled: true
  expected_status: 200

warmup:
  requests: 5

output:
  directory: ../results

wrk2:
  binary: wrk2
