target:
  # The runner resolves the download URL for this snap, channel, and
  # architecture through the Store info API at the start of --run.
  store_url: https://api.snapcraft.io
  snap: gimp
  channel: latest/stable
  architecture: amd64
  # Production Store size observed on 2026-11-19 (~141 MiB).
  expected_size_bytes: 147804160
  # Count complete snaps, not byte-range responses, as downloads.
  byte_range: null
  store_headers:
    Snap-Device-Architecture: amd64
    Snap-Device-Series: "16"
  download_headers:
    Accept-Encoding: identity

load:
  # Each connection starts another download as soon as the previous finishes.
  concurrent_downloads: [2, 4, 8, 16]
  # Four five-minute stages: 20 minutes plus preflight, warmup and pauses.
  duration: 5m
  # Two threads divide every connection count evenly.
  threads: 2
  # Allow slower cold fetches and longer measured response latencies.
  # This does not extend the stage deadline or drain unfinished downloads.
  timeout: 5m
  pause_seconds: 5

preflight:
  expected_redirect_status: 302
  expected_download_status: 200
  max_redirects: 5

# Warmup downloads use load.timeout; raise it for large cold snaps.
warmup:
  requests: 3

safety:
  # Concurrency does not predict total bytes. The runner requires explicit
  # --allow-over-budget for this mode; this is not a runtime transfer cap.
  # These estimate settings apply when using rate-based profiles.
  estimate_multiplier: 2.0
  max_estimated_transfer_mib: 2048

output:
  directory: ../results

wrk:
  binary: wrk
