target:
  # The runner resolves the download URL for this snap, channel, and
  # architecture through the Store info API at the start of --run.
  store_url: https://api.snapcraft.io
  snap: gimp
  channel: latest/stable
  architecture: amd64
  # gimp revision 561 is 147,734,528 bytes (~141 MiB).
  expected_size_bytes: 147734528
  # A 16 MiB range makes each request take seconds, amortizing per-request
  # overhead so per-connection throughput approaches the wire ceiling.
  byte_range: "0-16777215"
  store_headers:
    Snap-Device-Architecture: amd64
    Snap-Device-Series: "16"
  download_headers:
    Accept-Encoding: identity

load:
  # Target rates deliberately exceed capacity: each stage saturates its
  # connections (10/20/40), so achieved throughput shows the roof.
  downloads_per_second:
    start: 10
    end: 40
    increment: 10
  # Stages must exceed 10s: wrk2 discards the first ~10s of latency samples
  # as calibration, so shorter stages produce empty latency graphs.
  duration: 20s
  # Top stage runs at 40 connections and 4 threads.
  connections: 40
  threads: 4
  scale_workers_with_rate: true
  # Longer timeout so warmup downloads can finish while the CDN ingests a
  # cold 141 MiB object; warm 4 MiB ranges complete in about a second.
  timeout: 30s
  pause_seconds: 5

preflight:
  expected_redirect_status: 302
  expected_download_status: 206
  max_redirects: 5

# Warmup downloads use load.timeout; raise it for large cold snaps.
warmup:
  requests: 3

safety:
  # The scheduled estimate (100 summed DPS x 20s x 16 MiB = 31 GiB) assumes
  # every stage hits its target rate. These targets deliberately exceed
  # capacity, so actual transfer is bounded by connections (~8-12 GiB);
  # run with --allow-over-budget.
  estimate_multiplier: 2.0
  max_estimated_transfer_mib: 2048

output:
  directory: ../results

wrk2:
  binary: wrk2
