name: custom-metrics-exporter
summary: Install prometheus-pushgateway snap

description: |
  Machine charm that installs prometheus-pushgateway snap
  used to collect custom metrics on port 9091.

type: charm
base: ubuntu@24.04
platforms:
  amd64:

resources:
  exporter-snap:
    type: file
    filename: prometheus-pushgateway.snap
    description: Local .snap payload for prometheus-pushgateway.

parts:
  charm:
    plugin: charm
    source: .
    charm-requirements:
      - requirements.txt
