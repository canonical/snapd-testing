[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "store-load"
version = "0.1.0"
description = "Controlled load testing for Snap Store deployments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
store-load = "store_load.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
